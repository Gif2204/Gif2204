<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>เข้าสู่ระบบ · สวนสับปะรด</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8f2;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#243128;padding:18px}.box{width:min(100%,410px);background:white;border:1px solid #e1e9df;border-radius:22px;padding:28px;box-shadow:0 14px 50px #183b1810}.logo{font-size:42px}h1{margin:8px 0;font-size:25px}p{color:#6b776d;line-height:1.65}input,button{width:100%;padding:13px;border-radius:11px;font:inherit;margin-top:10px}input{border:1px solid #d9e3d8}button{border:0;background:#2f7d32;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.sub{font-size:13px}.msg{min-height:24px;font-size:13px;color:#526052}.alt{background:#edf4eb;color:#2f6631} [hidden]{display:none!important}
</style></head><body><main class="box"><div class="logo">🍍</div><h1>บัญชีสวนสับปะรด</h1><p id="sub">เข้าสู่ระบบด้วยอีเมล ระบบจะส่งรหัสยืนยันให้คุณ ข้อมูลจะซิงก์ระหว่างมือถือและคอมพิวเตอร์</p>
<form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="อีเมลของคุณ" required><input id="code" hidden inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="รหัส 6 หลักที่ได้รับทางอีเมล"><button id="submit">ส่งรหัสยืนยัน</button><button type="button" id="back" class="alt" hidden>เปลี่ยนอีเมล</button></form>
<section id="passkey" hidden><p>ต้องการใช้ลายนิ้วมือ ใบหน้า หรือรหัสล็อกหน้าจอเพื่อเข้าสู่ระบบครั้งต่อไปไหม?</p><button id="add">ตั้งค่าการเข้าสู่ระบบแบบรวดเร็ว</button><button id="skip" class="alt">ไว้ก่อน</button></section><div id="msg" class="msg" role="status" aria-live="polite"></div></main>
<script>
(()=>{const A=window.hatchable&&window.hatchable.auth,$=id=>document.getElementById(id);let step='email',hasPasskey=false;function next(){let n=new URLSearchParams(location.search).get('next')||'/';if(!n.startsWith('/')||n.startsWith('//')||n.includes('\\')||/[\u0000-\u001f\u007f]/.test(n))n='/';location.replace(n)}function say(t){$('msg').textContent=t}
if(!A){say('ระบบเข้าสู่ระบบยังไม่พร้อม กรุณาลองใหม่ภายหลัง');$('submit').disabled=true;return}
A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});
$('back').onclick=()=>{step='email';$('email').readOnly=false;$('email').hidden=false;$('code').hidden=true;$('back').hidden=true;$('submit').textContent='ส่งรหัสยืนยัน';$('sub').textContent='เข้าสู่ระบบด้วยอีเมล ระบบจะส่งรหัสยืนยันให้คุณ';say('')};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{if(step==='email'){let email=$('email').value.trim();let r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{let d=await A.signInWithPasskey({email});if(d&&d.user){next();return}}catch(e){}}
step='code';$('code').hidden=false;$('back').hidden=false;$('email').readOnly=true;$('submit').textContent='ยืนยันรหัส';$('sub').textContent='กรอกรหัส 6 หลักที่ส่งไปยัง '+email;say('ส่งรหัสแล้ว กรุณาตรวจสอบอีเมล')}
else{let d=await A.verifyCode({email:$('email').value.trim(),code:$('code').value.trim()});if(d&&d.user){if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('pineapple-passkey-declined')!=='1'){$('form').hidden=true;$('passkey').hidden=false;$('sub').textContent='เข้าสู่ระบบสำเร็จ';return}next()}}}catch(err){say(err&&err.status===429?'ลองใหม่อีกครั้งในอีกสักครู่':(err.message||'ไม่สำเร็จ กรุณาตรวจสอบข้อมูลแล้วลองใหม่'))}finally{$('submit').disabled=false}};
$('add').onclick=async()=>{try{await A.registerPasskey({name:'อุปกรณ์เข้าสู่ระบบสวนสับปะรด'})}catch(e){}next()};$('skip').onclick=()=>{localStorage.setItem('pineapple-passkey-declined','1');next()};
})();
</script></body></html>
