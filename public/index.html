<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7d32"><title>บัญชีสวนสับปะรด</title>
<style>
:root{--g:#2f7d32;--p:#eaf5e9;--ink:#243128;--muted:#748078;--line:#e5ebe5;--bg:#f6f8f5;--red:#c75b45}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:28px}.brand b{display:block}.brand span,.muted,small{color:var(--muted)}.brand span{font-size:11px}.wrap{max-width:1180px;margin:auto;padding:16px}.plotbar{display:flex;gap:8px;align-items:center;background:var(--p);padding:10px;border-radius:14px;margin-bottom:12px;flex-wrap:wrap}.plotbar select{flex:1;min-width:0}.control,select,input,textarea{border:1px solid #dce4dc;background:#fff;border-radius:10px;padding:9px 11px}.primary{background:var(--g);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-weight:700}.nav{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:15px}.nav button{white-space:nowrap;border:0;background:transparent;padding:11px;color:#68736b}.nav button.active{color:var(--g);font-weight:700;border-bottom:2px solid var(--g)}.hero{background:linear-gradient(135deg,#fff,#f1f8ef);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{margin:3px 0;font-size:26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:12px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px}.card{padding:15px}.card small{display:block}.card strong{display:block;font-size:20px;margin-top:5px;overflow-wrap:anywhere}.income{color:var(--g)}.expense{color:var(--red)}.panel{margin:12px 0;overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.panelhead h2,.panelhead h3{margin:0}.tx{padding:13px 17px;border-bottom:1px solid #f0f2ef;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}.tx b,.tx small{display:block}.tx small{font-size:12px}.amount{font-weight:800;white-space:nowrap}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:0;background:#f1f4f0;border-radius:8px;padding:7px 9px;font-size:12px}.danger{color:var(--red)}.empty{padding:40px;text-align:center;color:var(--muted)}.filters{display:flex;gap:8px;padding:12px}.filters input:first-child{flex:1}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:13px}.quick button{padding:14px;border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left}.quick b,.quick span{display:block}.quick span{font-size:11px;color:var(--muted)}.barrow{padding:13px 17px;border-bottom:1px solid #f0f2ef;display:grid;grid-template-columns:1fr auto;gap:5px}.bar{grid-column:1/-1;height:7px;background:#edf1ed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#68a76c}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0ed;text-align:left;white-space:nowrap}.table th{background:#f7f9f7}.modal{position:fixed;inset:0;background:#17201866;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:19px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f1f3f0;border-radius:9px;padding:8px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#f0f3ef;padding:4px;border-radius:11px;margin:13px 0}.seg button{border:0;background:transparent;padding:9px;border-radius:8px}.seg .on{background:#fff;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#657168}.wide{grid-column:1/-1}.formfoot{margin-top:13px;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:16px;bottom:16px;background:#243128;color:#fff;padding:11px 14px;border-radius:11px;z-index:10;max-width:calc(100vw - 32px)}.status{font-size:12px;color:#5d755f}.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4d9c53;margin-right:5px}.note{padding:12px 15px;background:#f4f8f2;border:1px solid #e1ebdd;border-radius:12px;font-size:13px;line-height:1.6}.settingsbtn{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
@media(max-width:760px){.top{padding:10px}.wrap{padding:10px}.cards{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column;padding:17px}.hero h1{font-size:23px}.tx{grid-template-columns:1fr auto}.tx .actions{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.filters{flex-direction:column}.brand b{font-size:15px}.brand span{font-size:10px}.top .primary{padding:9px 10px;font-size:13px}}
@media print{.top,.plotbar,.nav,.no-print{display:none!important}.wrap{max-width:none;padding:0}.panel,.card{break-inside:avoid}}
</style></head><body><div id="app"><div class="empty">กำลังเปิดระบบบัญชีสวนสับปะรด…</div></div>
<script>
(function(){
'use strict';
var KEY='pineapple-farm-demo-v1', data={plots:[],tx:[]}, plotId=null, tab='dashboard', search='', month='', editing=null, serverUpdated=null, saving=false, modalOpen=false, saveQueue=Promise.resolve();
var cats=['ค่าแรง','ค่าไถ/เตรียมแปลง','ค่าหน่อพันธุ์','ปุ๋ย','ยาป้องกันศัตรูพืช','ค่าน้ำ/ไฟ','ค่าเครื่องจักร','ค่าขนส่ง','ค่าเช่า','ค่าใช้จ่ายอื่นๆ','ขายผลผลิต','รายรับอื่นๆ'];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(s){var d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(function(){d.remove()},3000)}
function auth(){return window.hatchable&&window.hatchable.auth}
function signOut(){auth().signOut().then(function(){location.href='/login'}).catch(function(){location.href='/login'})}
async function api(method,body){var r=await fetch('/api/farm-data',{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});var j=await r.json().catch(function(){return {}});if(!r.ok){if(r.status===401){location.href='/login?next=%2F';throw Error('กรุณาเข้าสู่ระบบอีกครั้ง')}throw Error(j.error||'เชื่อมต่อฐานข้อมูลไม่สำเร็จ')}return j}
async function loadCloud(showToast){var j=await api('GET');data=j.data||{plots:[],tx:[]};serverUpdated=j.updated_at||null;if(!data.plots.length)plotId=null;else if(!data.plots.some(function(p){return p.id===plotId}))plotId=data.plots[0].id;render();if(showToast)toast('โหลดข้อมูลล่าสุดจากระบบออนไลน์แล้ว')}
function saveCloud(){saving=true;var snap=JSON.parse(JSON.stringify(data));saveQueue=saveQueue.then(async function(){try{var j=await api('POST',{data:snap});serverUpdated=j.updated_at||serverUpdated;if($('syncstatus'))$('syncstatus').innerHTML='<span class="syncdot"></span>บันทึกออนไลน์แล้ว'}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message);if($('syncstatus'))$('syncstatus').textContent='บันทึกไม่สำเร็จ กรุณาลองใหม่'}finally{saving=false}});return saveQueue}
async function commit(){render();await saveCloud()}
function plot(){return data.plots.find(function(x){return x.id===plotId})}
function tx(){return data.tx.filter(function(x){return x.plotId===plotId}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id})}
function totals(list){return (list||tx()).reduce(function(a,t){a[t.type]+=+t.amount;return a},{income:0,expense:0})}
function render(){var p=plot(),t=totals();var plots=data.plots.map(function(x){return '<option value="'+x.id+'" '+(x.id===plotId?'selected':'')+'>'+esc(x.name)+' · '+(x.area||0)+' ไร่ · รุ่น '+esc(x.cycle||'-')+'</option>'}).join('');$('app').innerHTML='<header class="top"><div class="brand"><div class="logo">🍍</div><div><b>สวนสับปะรด</b><span>บัญชีรายรับ · รายจ่าย · ต้นทุนออนไลน์</span></div></div><div class="actions"><button class="primary" onclick="openForm()">＋ บันทึกรายการ</button><button class="control" onclick="signOut()">ออกจากระบบ</button></div></header><div class="wrap"><div class="plotbar"><label>แปลงที่ใช้งาน</label><select onchange="changePlot(this.value)" '+(!data.plots.length?'disabled':'')+'>'+plots+'</select><button class="control" onclick="addPlot()">＋ แปลง</button><span id="syncstatus" class="status"><span class="syncdot"></span>เชื่อมต่อฐานข้อมูลออนไลน์</span></div><nav class="nav">'+[['dashboard','ภาพรวม'],['transactions','รายการบัญชี'],['reports','รายงาน'],['settings','จัดการ/สำรองข้อมูล']].map(function(x){return '<button class="'+(tab===x[0]?'active':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</nav>'+(!data.plots.length?emptyStart():tab==='dashboard'?dashboard(p,t):tab==='transactions'?transactionsView():tab==='reports'?reports(p,t):settingsView())+'</div>'}
function emptyStart(){return '<section class="hero"><div><div class="muted">เริ่มต้นใช้งาน</div><h1>สร้างบัญชีสวนของคุณ</h1><p>ยังไม่มีแปลงปลูกในบัญชีนี้ เพิ่มแปลงแรกเพื่อเริ่มบันทึกรายรับและรายจ่ายได้เลย</p><button class="primary" onclick="addPlot()">＋ เพิ่มแปลงปลูกแรก</button></div><div>🍍</div></section><div class="note">ข้อมูลจะถูกบันทึกลงฐานข้อมูลออนไลน์ของบัญชีนี้ เปิดด้วยอีเมลเดียวกันบนมือถือหรือคอมพิวเตอร์เพื่อใช้ข้อมูลชุดเดียวกัน</div>'}
function dashboard(p,t){return '<section class="hero"><div><div class="muted">แปลงปัจจุบัน</div><h1>'+esc(p.name)+'</h1><div class="muted">พื้นที่ '+(p.area||0)+' ไร่ · รอบปลูก '+esc(p.cycle||'-')+'</div></div><button class="primary" onclick="openForm()">＋ รายการใหม่</button></section><div class="cards"><div class="card"><small>💰 รายรับสะสม</small><strong class="income">฿ '+money(t.income)+'</strong></div><div class="card"><small>💸 รายจ่ายสะสม</small><strong class="expense">฿ '+money(t.expense)+'</strong></div><div class="card"><small>📊 คงเหลือสุทธิ</small><strong>฿ '+money(t.income-t.expense)+'</strong></div><div class="card"><small>🌱 ต้นทุน/ไร่</small><strong>฿ '+money(t.expense/(p.area||1))+'</strong></div></div><div class="panel"><div class="panelhead"><h3>รายการล่าสุด</h3><span>'+tx().length+' รายการ</span></div>'+(tx().slice(0,7).map(row).join('')||'<div class="empty">ยังไม่มีรายการบัญชี กด “บันทึกรายการ” เพื่อเริ่มต้น</div>')+'</div><div class="panel no-print"><div class="panelhead"><h3>บันทึกด่วน</h3></div><div class="quick">'+['ปุ๋ย','ค่าแรง','ขายผลผลิต','ค่าไถ/เตรียมแปลง'].map(function(c){return '<button onclick="quick(\''+c+'\')"><b>＋ '+c+'</b><span>บันทึกได้ทันที</span></button>'}).join('')+'</div></div>'}
function row(x){return '<div class="tx"><div><b>'+esc(x.cat)+'</b><small>'+esc(x.date)+' · '+esc(x.detail)+(x.person?' · '+esc(x.person):'')+(x.qty?' · '+x.qty+' '+esc(x.unit||''):'')+'</small></div><div class="amount '+x.type+'">'+(x.type==='income'?'+':'−')+'฿ '+money(x.amount)+'</div><div class="actions no-print"><button class="mini" onclick="editTx('+x.id+')">แก้ไข</button><button class="mini danger" onclick="delTx('+x.id+')">ลบ</button></div></div>'}
function transactionsView(){var list=tx().filter(function(x){return (!search||[x.cat,x.detail,x.person,x.note].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!month||x.date.startsWith(month))});return '<div class="panel"><div class="panelhead"><div><h2>รายการบัญชีทั้งหมด</h2><div class="muted">ค้นหาและแก้ไขรายการย้อนหลังได้</div></div><button class="primary" onclick="openForm()">＋ เพิ่มรายการ</button></div><div class="filters"><input placeholder="🔎 ค้นหารายการ..." value="'+esc(search)+'" oninput="search=this.value;render()"><input type="month" value="'+month+'" onchange="month=this.value;render()"></div>'+(list.map(row).join('')||'<div class="empty">ไม่พบรายการบัญชี</div>')+'</div>'}
function reports(p,t){var c={};tx().filter(function(x){return x.type==='expense'}).forEach(function(x){c[x.cat]=(c[x.cat]||0)+x.amount});var top=Object.entries(c).sort(function(a,b){return b[1]-a[1]}),max=top[0]?top[0][1]:1;return '<div class="panel"><div class="panelhead"><div><h2>รายงานต้นทุน</h2><div class="muted">'+esc(p.name)+' · '+(p.area||0)+' ไร่</div></div><div class="actions"><button class="control" onclick="exportExcel()">ส่งออก Excel</button><button class="control" onclick="printPDF()">PDF / พิมพ์</button></div></div><div class="cards"><div class="card"><small>รายรับ</small><strong class="income">฿ '+money(t.income)+'</strong></div><div class="card"><small>รายจ่าย</small><strong class="expense">฿ '+money(t.expense)+'</strong></div><div class="card"><small>กำไร/ขาดทุน</small><strong>฿ '+money(t.income-t.expense)+'</strong></div><div class="card"><small>ต้นทุน/ไร่</small><strong>฿ '+money(t.expense/(p.area||1))+'</strong></div></div><div class="panelhead"><h3>ค่าใช้จ่ายแยกตามหมวด</h3></div>'+(top.map(function(x){return '<div class="barrow"><span>'+esc(x[0])+'</span><b>฿ '+money(x[1])+'</b><div class="bar"><i style="width:'+Math.max(4,x[1]/max*100)+'%"></i></div></div>'}).join('')||'<div class="empty">ยังไม่มีค่าใช้จ่าย</div>')+'</div><div class="panel"><div class="panelhead"><h3>รายละเอียดรายการบัญชี</h3></div><div class="tablewrap"><table class="table"><thead><tr><th>วันที่</th><th>ประเภท</th><th>หมวด</th><th>รายละเอียด</th><th>ผู้ขาย/ผู้รับ</th><th>จำนวนเงิน</th></tr></thead><tbody>'+tx().map(function(x){return '<tr><td>'+esc(x.date)+'</td><td>'+(x.type==='income'?'รายรับ':'รายจ่าย')+'</td><td>'+esc(x.cat)+'</td><td>'+esc(x.detail)+'</td><td>'+esc(x.person||'')+'</td><td>฿ '+money(x.amount)+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
function settingsView(){return '<div class="panel"><div class="panelhead"><div><h2>จัดการแปลงปลูก</h2><div class="muted">ข้อมูลแต่ละแปลงและรายการบัญชีแยกจากกัน</div></div><button class="primary" onclick="addPlot()">＋ เพิ่มแปลง</button></div>'+data.plots.map(function(p){return '<div class="tx"><div><b>'+esc(p.name)+'</b><small>'+(p.area||0)+' ไร่ · รุ่น '+esc(p.cycle||'-')+'</small></div><div></div><div class="actions"><button class="mini" onclick="editPlot('+p.id+')">แก้ไข</button><button class="mini danger" onclick="delPlot('+p.id+')">ลบ</button></div></div>'}).join('')+'</div><div class="panel"><div class="panelhead"><div><h2>สำรองและย้ายข้อมูล</h2><div class="muted">ฐานข้อมูลออนไลน์เป็นแหล่งข้อมูลหลัก</div></div></div><div class="settingsbtn"><button class="control" onclick="backup()">ดาวน์โหลด Backup JSON</button><button class="control" onclick="$(\'restorefile\').click()">นำเข้า Backup JSON</button><input id="restorefile" type="file" accept=".json,application/json" hidden onchange="restore(this)"><button class="control" onclick="importOld()">นำเข้าข้อมูลจากเบราว์เซอร์เดิม</button><button class="control" onclick="loadCloud(true)">↻ ซิงก์ข้อมูลตอนนี้</button><button class="control" onclick="exportExcel()">ส่งออก Excel</button><button class="control" onclick="printPDF()">พิมพ์รายงาน / PDF</button></div><div style="padding:0 14px 14px"><div class="note">ข้อมูลบัญชีเก็บบนฐานข้อมูลออนไลน์และผูกกับบัญชีที่เข้าสู่ระบบ แนะนำให้ดาวน์โหลดไฟล์สำรองเป็นระยะ ก่อนนำเข้าข้อมูลเก่าให้ตรวจสอบก่อน เพราะข้อมูลเดิมอาจมีรายการตัวอย่างสำหรับสาธิต</div><p class="muted">สถานะ: '+(serverUpdated?'ซิงก์แล้ว':'กำลังเชื่อมต่อ')+'</p></div></div>'}
function changePlot(v){plotId=+v;render()}function setTab(v){tab=v;render()}
function addPlot(){var name=prompt('ชื่อแปลงปลูก');if(!name||!name.trim())return;var area=prompt('พื้นที่ (ไร่)','10'),cycle=prompt('รอบปลูก เช่น 2569/1','2569/1'),id=Date.now();data.plots.push({id:id,name:name.trim(),area:+area||0,cycle:cycle||'-'});plotId=id;commit()}
function editPlot(id){var p=data.plots.find(function(x){return x.id===id});if(!p)return;var name=prompt('ชื่อแปลง',p.name);if(name===null)return;p.name=name.trim()||p.name;p.area=+(prompt('พื้นที่ (ไร่)',p.area)||p.area);p.cycle=prompt('รอบปลูก',p.cycle)||p.cycle;commit()}
function delPlot(id){if(data.plots.length===1)return alert('ต้องเหลืออย่างน้อย 1 แปลง');if(!confirm('ลบแปลงและรายการบัญชีทั้งหมดของแปลงนี้หรือไม่?'))return;data.plots=data.plots.filter(function(p){return p.id!==id});data.tx=data.tx.filter(function(x){return x.plotId!==id});plotId=data.plots[0].id;commit()}
function openForm(pref){pref=pref||{};editing=null;showForm(Object.assign({date:today(),type:'expense',cat:'ค่าแรง',detail:'',amount:'',person:'',qty:'',unit:'',note:''},pref))}
function quick(cat){openForm({cat:cat,type:(cat==='ขายผลผลิต'||cat==='รายรับอื่นๆ')?'income':'expense'})}
function editTx(id){var x=data.tx.find(function(a){return a.id===id});if(x){editing=x;showForm(Object.assign({},x))}}
function delTx(id){if(confirm('ลบรายการนี้หรือไม่?')){data.tx=data.tx.filter(function(x){return x.id!==id});commit().then(function(){toast('ลบรายการแล้ว')})}}
function showForm(f){if(!plotId){toast('กรุณาเพิ่มแปลงปลูกก่อน');return}modalOpen=true;var m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<form class="sheet" onsubmit="submitForm(event)"><div class="sheethead"><div><h2>'+(editing?'แก้ไขรายการ':'บันทึกรายการ')+'</h2><div class="muted">'+esc(plot().name)+'</div></div><button type="button" class="close" onclick="closeForm()">✕</button></div><div class="seg"><button type="button" class="'+(f.type==='expense'?'on':'')+'" onclick="setType(\'expense\')">💸 รายจ่าย</button><button type="button" class="'+(f.type==='income'?'on':'')+'" onclick="setType(\'income\')">💰 รายรับ</button></div><div class="formgrid"><label class="field">วันที่<input id="fdate" type="date" required value="'+esc(f.date)+'"></label><label class="field">หมวดหมู่<select id="fcat">'+cats.map(function(c){return '<option '+(c===f.cat?'selected':'')+'>'+c+'</option>'}).join('')+'</select></label><label class="field wide">รายละเอียด<input id="fdetail" required value="'+esc(f.detail)+'" placeholder="เช่น ใส่ปุ๋ยครั้งที่ 2"></label><label class="field">จำนวนเงิน (บาท)<input id="famount" required type="number" min="0" step=".01" value="'+f.amount+'" inputmode="decimal"></label><label class="field">ผู้ขาย / ผู้รับ / ล้ง<input id="fperson" value="'+esc(f.person||'')+'"></label><label class="field">จำนวน<input id="fqty" type="number" min="0" step=".01" value="'+(f.qty||'')+'" inputmode="decimal"></label><label class="field">หน่วย<input id="funit" value="'+esc(f.unit||'')+'" placeholder="กระสอบ / คน / ตัน"></label><label class="field wide">หมายเหตุ<textarea id="fnote" rows="2">'+esc(f.note||'')+'</textarea></label></div><div class="formfoot"><button type="button" class="control" onclick="closeForm()">ยกเลิก</button><button class="primary">บันทึกออนไลน์</button></div></form>';document.body.append(m);window._formType=f.type}
function closeForm(){$('modal')&&$('modal').remove();modalOpen=false}
function setType(v){window._formType=v;var m=$('modal');if(m)Array.from(m.querySelectorAll('.seg button')).forEach(function(b,i){b.classList.toggle('on',(i===0&&v==='expense')||(i===1&&v==='income'))})}
async function submitForm(e){e.preventDefault();var x={id:editing?editing.id:Date.now(),plotId:plotId,date:$('fdate').value,type:window._formType,cat:$('fcat').value,detail:$('fdetail').value,amount:+$('famount').value,person:$('fperson').value,qty:+$('fqty').value||'',unit:$('funit').value,note:$('fnote').value};if(editing){var i=data.tx.findIndex(function(a){return a.id===editing.id});data.tx[i]=x}else data.tx.push(x);closeForm();await commit();toast('บันทึกข้อมูลออนไลน์แล้ว')}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function exportExcel(){var p=plot();if(!p){toast('ยังไม่มีแปลงปลูก');return}var t=totals(),rows=tx().map(function(x){return [x.date,x.type==='income'?'รายรับ':'รายจ่าย',x.cat,x.detail,x.person,x.qty,x.unit,x.note,x.amount]});rows.push(['','','','','','','','รวมรายรับ',t.income],['','','','','','','','รวมรายจ่าย',t.expense],['','','','','','','','คงเหลือ',t.income-t.expense]);var head=['วันที่','ประเภท','หมวดหมู่','รายละเอียด','ผู้ขาย/ผู้รับ','จำนวน','หน่วย','หมายเหตุ','จำนวนเงิน'];var html='<html><head><meta charset="utf-8"></head><body><h2>'+esc(p.name)+' - รายรับรายจ่าย</h2><table border="1"><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table></body></html>';download(new Blob(['\\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'}),p.name+'-บัญชีสวน.xls')}
function printPDF(){window.print()}
function backup(){download(new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),plots:data.plots,tx:data.tx},null,2)],{type:'application/json'}),'pineapple-backup-'+today()+'.json');toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
async function restore(inp){var f=inp.files[0];if(!f)return;try{var d=JSON.parse(await f.text());if(!Array.isArray(d.plots)||!Array.isArray(d.tx))throw Error();if(!confirm('นำเข้าไฟล์นี้และแทนที่ข้อมูลออนไลน์ปัจจุบันทั้งหมดหรือไม่?'))return;data={plots:d.plots,tx:d.tx};plotId=data.plots[0]?data.plots[0].id:null;await commit();toast('นำเข้าข้อมูลสำเร็จ')}catch(e){alert('ไฟล์ Backup ไม่ถูกต้อง')}finally{inp.value=''}}
async function importOld(){var raw=localStorage.getItem(KEY);if(!raw)return alert('ไม่พบข้อมูลเดิมในเบราว์เซอร์นี้');var old;try{old=JSON.parse(raw)}catch(e){return alert('ข้อมูลเดิมอ่านไม่ได้')}if(!Array.isArray(old.plots)||!Array.isArray(old.tx))return alert('รูปแบบข้อมูลเดิมไม่ถูกต้อง');if(!confirm('พบแปลง '+old.plots.length+' แปลง และรายการบัญชี '+old.tx.length+' รายการในเบราว์เซอร์นี้\\n\\nข้อมูลเดิมอาจมีรายการตัวอย่าง โปรดตรวจสอบก่อนนำเข้า\\n\\nกด OK เพื่อนำเข้ารวมกับข้อมูลออนไลน์ หรือ Cancel เพื่อยกเลิก'))return;var map={};old.plots.forEach(function(p){var id=Date.now()+Math.floor(Math.random()*100000);map[p.id]=id;data.plots.push(Object.assign({},p,{id:id,name:String(p.name||'แปลงเดิม')+' (นำเข้า)'}))});old.tx.forEach(function(x){data.tx.push(Object.assign({},x,{id:Date.now()+Math.floor(Math.random()*100000),plotId:map[x.plotId]||(data.plots[0]&&data.plots[0].id)}))});plotId=data.plots[0]?data.plots[0].id:null;await commit();toast('นำเข้าข้อมูลจากเบราว์เซอร์เดิมแล้ว')}
window.changePlot=changePlot;window.setTab=setTab;window.addPlot=addPlot;window.editPlot=editPlot;window.delPlot=delPlot;window.openForm=openForm;window.quick=quick;window.editTx=editTx;window.delTx=delTx;window.closeForm=closeForm;window.setType=setType;window.submitForm=submitForm;window.exportExcel=exportExcel;window.printPDF=printPDF;window.backup=backup;window.restore=restore;window.importOld=importOld;window.loadCloud=loadCloud;window.signOut=signOut;
async function start(){var A=auth();if(!A){$('app').innerHTML='<div class="empty">ระบบเข้าสู่ระบบไม่พร้อม กรุณาเปิดใหม่ภายหลัง</div>';return}try{var s=await A.getSession();if(!s||!s.user){location.replace('/login?next=%2F');return}await loadCloud()}catch(e){$('app').innerHTML='<div class="empty">เชื่อมต่อข้อมูลไม่สำเร็จ<br><button class="primary" onclick="location.reload()">ลองอีกครั้ง</button><p>'+esc(e.message)+'</p></div>'}}
start();
setInterval(async function(){if(document.hidden||modalOpen||saving)return;try{var j=await api('GET'),stamp=j.updated_at||null;if(stamp&&stamp!==serverUpdated){data=j.data||{plots:[],tx:[]};serverUpdated=stamp;plotId=data.plots.some(function(p){return p.id===plotId})?plotId:(data.plots[0]?data.plots[0].id:null);render();toast('ซิงก์ข้อมูลล่าสุดแล้ว')}}catch(e){}},30000);
})();
</script></body></html>
